name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run verify

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global vercel@65.14.0
      - name: Validate Vercel authentication
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::A valid VERCEL_TOKEN repository or environment secret is required."
            exit 1
          fi
          if ! vercel whoami --token="$VERCEL_TOKEN" >/dev/null 2>&1; then
            echo "::error::VERCEL_TOKEN is invalid or expired. Create a new Vercel access token and update the GitHub repository or production environment secret."
            exit 1
          fi
      - name: Deploy Frontend to Vercel
        run: |
          scope_args=()
          if [ -n "$VERCEL_SCOPE" ]; then
            scope_args+=(--scope "$VERCEL_SCOPE")
          fi
          vercel link --yes --project erp-pointfex "${scope_args[@]}" --token="$VERCEL_TOKEN"
          vercel pull --yes --environment=production "${scope_args[@]}" --token="$VERCEL_TOKEN"
          vercel build --prod "${scope_args[@]}" --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod "${scope_args[@]}" --token="$VERCEL_TOKEN"
      - name: Deploy Backend to Vercel
        run: |
          scope_args=()
          if [ -n "$VERCEL_SCOPE" ]; then
            scope_args+=(--scope "$VERCEL_SCOPE")
          fi
          vercel link --yes --project backend-erp-pointfex "${scope_args[@]}" --token="$VERCEL_TOKEN"
          vercel pull --yes --environment=production "${scope_args[@]}" --token="$VERCEL_TOKEN"
          vercel build --prod "${scope_args[@]}" --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod "${scope_args[@]}" --token="$VERCEL_TOKEN"
